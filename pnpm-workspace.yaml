packages:
  - apps/*
  - packages/*

# Install scripts are opt-in (pnpm 11 allowBuilds). Prisma/esbuild/tailwind
# need theirs; scarf is telemetry and stays disabled.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  sharp: true
  '@tailwindcss/oxide': true
  unrs-resolver: true
  argon2: true
  '@scarf/scarf': false
